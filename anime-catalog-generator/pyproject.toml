[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-catalog-generator"
version = "0.1.0"
description = "Genera y sincroniza catálogos de anime en MDBList a partir de AniList/MyAnimeList usando mappings abiertos (AniBridge, Kometa, Fribb)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# Sin extras nativos (uvicorn[standard] trae uvloop/httptools, que no compilan bien en Android).
ui = []
dev = ["pytest>=8"]

[project.scripts]
anime-catalog = "anime_catalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anime_catalog.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "benchmark: mediciones de rendimiento con datasets reales (ANIME_CATALOG_BENCHMARK=1)",
  "live: pruebas opcionales de solo lectura contra APIs reales (ANIME_CATALOG_LIVE_TESTS=1)",
]
