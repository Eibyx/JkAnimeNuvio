name: CI

# When the tests run:
# - push to main: every merge or direct change to main (also feeds the README badge).
# - pull_request to main: every development branch (feature/*, fix/*…) is tested
#   through its PR, once per commit. Branch pushes are not tested separately, so
#   the same commit does not run twice.
# - workflow_dispatch: manual run for a branch that has no PR yet (Actions → CI →
#   "Run workflow").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR/branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported LTS lines: 22 (Jod) and 24 (Krypton). Node 20 reached
        # end-of-life on 2026-04-30 and is no longer tested.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
