name: Anime Catalog · tests

# Pruebas del generador de catálogos (anime-catalog-generator/). No usan red ni credenciales:
# AniList, TMDB y MDBList se simulan con fixtures construidos a partir de datos reales.
on:
  push:
    branches: [main]
    paths: ["anime-catalog-generator/**", ".github/workflows/anime-catalog-*.yml"]
  pull_request:
    paths: ["anime-catalog-generator/**", ".github/workflows/anime-catalog-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-catalog-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: anime-catalog-generator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: anime-catalog-generator/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Validar perfiles YAML
        run: anime-catalog validate filters/anime-2020s.yaml filters/anime-2010s.yaml filters/anime-movies.yaml filters/anime-mappa.yaml filters/anime-isekai.yaml
