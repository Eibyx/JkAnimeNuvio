name: Anime Catalog · actualizar mappings

# Comprueba a diario si AniBridge, Kometa y Fribb publicaron datasets nuevos (ETag/Last-Modified),
# los valida e indexa. Si un dataset nuevo no supera la validación se conserva el anterior.
# Los datasets e índices se guardan en la caché de Actions; los overrides viven en el repositorio
# (overrides.yaml) y en la rama de estado, así que nunca se pierden.
on:
  schedule:
    - cron: "17 7 * * *"   # AniBridge publica a diario ~07:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Descargar aunque no haya cambios"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: anime-catalog-mdblist   # nunca a la vez que una sincronización
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-catalog-generator
    env:
      DATABASE_PATH: data/anime_catalog.db
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anime-catalog-generator/pyproject.toml
      - run: python -m pip install -e .
      - name: Restaurar datasets e índice
        uses: actions/cache/restore@v6
        with:
          path: anime-catalog-generator/data
          key: anime-catalog-data-${{ github.run_id }}
          restore-keys: anime-catalog-data-
      - name: Actualizar mappings
        run: anime-catalog mappings update ${{ inputs.force && '--force' || '' }}
      - run: anime-catalog mappings status
      - name: Guardar datasets e índice
        if: always()
        uses: actions/cache/save@v6
        with:
          path: anime-catalog-generator/data
          key: anime-catalog-data-${{ github.run_id }}
