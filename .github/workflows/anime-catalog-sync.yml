name: Anime Catalog · sincronizar catálogos

# Sincronización semanal de los perfiles habilitados (filters/*.yaml con catalog.enabled: true)
# y ejecución manual de un perfil concreto. Credenciales en GitHub Secrets:
#   MDBLIST_API_KEY (obligatoria para escribir), TMDB_API_KEY o TMDB_READ_ACCESS_TOKEN (recomendada).
# Estado persistente (elementos gestionados por lista, overrides, revisión, historial) en la rama
# `anime-catalog-state`; los datasets y la caché de metadatos en la caché de Actions.
on:
  schedule:
    - cron: "41 5 * * 1"   # lunes 05:41 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil (nombre del YAML sin extensión, p. ej. anime-2020s) o 'all'"
        type: string
        default: all
      mode:
        description: "Modo de sincronización"
        type: choice
        options: [config, append, sync]
        default: append
      dry_run:
        description: "Simular sin modificar MDBList"
        type: boolean
        default: true

permissions:
  contents: write   # solo para guardar el estado en la rama anime-catalog-state

# Un único grupo: dos ejecuciones nunca modifican MDBList a la vez.
concurrency:
  group: anime-catalog-mdblist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: anime-catalog-generator
    env:
      MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
      DATABASE_PATH: data/anime_catalog.db
      REPORTS_DIR: reports
      LOG_LEVEL: INFO
      STATE_BRANCH: anime-catalog-state
    steps:
      - uses: actions/checkout@v7
      - name: Recuperar estado persistente
        run: |
          mkdir -p ../state
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$STATE_BRANCH"
            git show "origin/$STATE_BRANCH:state.json" > ../state/state.json || true
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anime-catalog-generator/pyproject.toml
      - run: python -m pip install -e .
      - name: Restaurar datasets y caché de metadatos
        uses: actions/cache/restore@v6
        with:
          path: anime-catalog-generator/data
          key: anime-catalog-data-${{ github.run_id }}
          restore-keys: anime-catalog-data-
      - run: anime-catalog state import ../state/state.json
      - run: anime-catalog mappings update
      - name: Sincronizar
        env:
          INPUT_PROFILE: ${{ inputs.profile || 'all' }}
          INPUT_MODE: ${{ inputs.mode || 'config' }}
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=(sync-all --dir filters --report-dir reports)
          if [ "$INPUT_PROFILE" != "all" ]; then args+=(--profile "$INPUT_PROFILE"); fi
          if [ "$INPUT_MODE" != "config" ]; then args+=(--mode "$INPUT_MODE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          elif [ -z "$MDBLIST_API_KEY" ]; then
            echo "::error::Falta el secret MDBLIST_API_KEY"; exit 1
          else
            args+=(--apply)
          fi
          anime-catalog "${args[@]}"
      - name: Guardar estado persistente
        if: always()
        run: |
          anime-catalog state export ../state/state.json
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp state/state.json "$tmp/state.json"
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$STATE_BRANCH"
            git worktree add "$tmp/wt" "origin/$STATE_BRANCH" --detach
          else
            git worktree add --orphan -b "$STATE_BRANCH" "$tmp/wt"
          fi
          cp "$tmp/state.json" "$tmp/wt/state.json"
          cd "$tmp/wt"
          git add state.json
          if git diff --cached --quiet; then echo "Estado sin cambios"; exit 0; fi
          git commit -m "Estado de anime-catalog (${GITHUB_RUN_ID})"
          git push origin "HEAD:refs/heads/$STATE_BRANCH"
      - name: Guardar datasets y caché de metadatos
        if: always()
        uses: actions/cache/save@v6
        with:
          path: anime-catalog-generator/data
          key: anime-catalog-data-${{ github.run_id }}
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anime-catalog-reports-${{ github.run_id }}
          path: anime-catalog-generator/reports
          retention-days: 30
